<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Planner Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.7); }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(14, 165, 233, 0); }
            100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }
        .timer-running {
            animation: pulse-ring 2s infinite;
        }

        @keyframes alarm-flash {
            0%, 100% { background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.8); }
            50% { background-color: rgba(239, 68, 68, 0.4); border-color: rgba(220, 38, 38, 1); }
        }
        .timer-alarm {
            animation: alarm-flash 0.8s infinite;
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 flex flex-col min-h-screen">

    <!-- Hidden File Input for Custom Profile Picture Upload -->
    <input type="file" id="profile-upload" accept="image/*" class="hidden">

    <!-- App Main Container -->
    <div id="app" class="flex-grow flex flex-col max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- HEADER SECTION -->
        <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 mb-6 border-b border-slate-200 dark:border-slate-800 gap-4">
            
            <!-- Samurai Avatar & Inline Editable Title -->
            <div class="flex items-center gap-3.5">
                <div class="relative group cursor-pointer" id="avatar-container" title="Click to upload custom profile picture">
                    <img id="app-avatar" src="" alt="Profile Avatar" class="w-14 h-14 rounded-full object-cover border-2 border-slate-200 dark:border-slate-700 shadow-md group-hover:brightness-75 transition-all">
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-camera text-white text-xs bg-slate-900/60 p-2 rounded-full"></i>
                    </div>
                </div>

                <div>
                    <div class="flex items-center gap-2 group">
                        <input id="planner-title" type="text" value="Weekly Planner Pro" 
                            class="bg-transparent text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white focus:bg-white dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 px-2 py-0.5 -ml-2 rounded-lg transition-all"
                            title="Click to edit planner title" />
                        <i class="fa-solid fa-pen text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity text-xs"></i>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 flex items-center gap-1.5" id="sync-status">
                        <i class="fa-solid fa-hard-drive text-slate-400"></i> Local Storage Active
                    </p>
                </div>
            </div>

            <!-- Header Action Controls -->
            <div class="flex flex-wrap items-center gap-2.5">

                <!-- Dark/Light Theme Toggle -->
                <button id="btn-theme-toggle" class="p-2.5 text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition shadow-sm" title="Toggle Light/Dark Theme">
                    <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400 text-lg"></i>
                </button>

                <!-- Auth Container -->
                <div id="auth-container" class="flex items-center">
                    <!-- One-Tap Google Sign-In Button -->
                    <button id="btn-google-login" class="flex items-center gap-2 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xs sm:text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/60 transition shadow-sm active:scale-95">
                        <svg class="w-4 h-4" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>Sign in with Google</span>
                    </button>

                    <!-- User Profile Badge when Logged In -->
                    <div id="user-profile" class="hidden flex items-center gap-2.5 bg-white dark:bg-slate-800 p-1.5 pr-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <img id="user-avatar" src="" alt="User Avatar" class="w-8 h-8 rounded-lg object-cover bg-slate-200">
                        <div class="hidden sm:block text-left text-xs">
                            <p id="user-name" class="font-semibold text-slate-800 dark:text-slate-100 truncate max-w-[110px]"></p>
                            <p id="user-email" class="text-slate-400 truncate max-w-[110px]"></p>
                        </div>
                        <button id="btn-logout" title="Sign Out" class="p-1.5 text-slate-400 hover:text-red-500 transition">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN TOOLBAR -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6">
            <div class="flex items-center gap-2">
                <button id="btn-open-add" class="flex-1 sm:flex-initial flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm px-4 py-2.5 rounded-xl shadow-md shadow-brand-500/20 transition active:scale-95">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Add Task</span>
                </button>

                <select id="filter-category" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm">
                    <option value="ALL">All Categories</option>
                    <option value="Work">💼 Work / Job</option>
                    <option value="Study">📚 Study / Code</option>
                    <option value="Personal">👤 Personal</option>
                    <option value="Fitness">🏋️ Fitness / Health</option>
                    <option value="General">📌 General</option>
                </select>
            </div>

            <div class="flex items-center justify-between sm:justify-end gap-3">
                <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl shadow-sm">
                    Completed: <span id="stat-progress" class="font-bold text-brand-600 dark:text-brand-400">0/0</span>
                </div>

                <div class="flex items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-1 rounded-xl shadow-sm">
                    <button id="view-btn-grid" class="p-2 text-xs font-semibold rounded-lg bg-brand-500 text-white transition">
                        <i class="fa-solid fa-border-all me-1"></i> Grid
                    </button>
                    <button id="view-btn-list" class="p-2 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition">
                        <i class="fa-solid fa-list me-1"></i> List
                    </button>
                </div>
            </div>
        </div>

        <!-- DYNAMIC PLANNER LAYOUT -->
        <main id="planner-container" class="flex-grow">
            <!-- Rendered by JS -->
        </main>
    </div>

    <!-- ADD / EDIT ACTIVITY MODAL -->
    <div id="modal-activity" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform transition-all scale-95 opacity-0 modal-content">
            <div class="flex items-center justify-between mb-5">
                <h3 id="modal-activity-title" class="text-lg font-bold text-slate-900 dark:text-white">Add Task</h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="form-activity" class="space-y-4">
                <input type="hidden" id="activity-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Task Title</label>
                    <input type="text" id="input-title" required placeholder="e.g., Team Sync, Code Feature, Gym Session" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Day</label>
                        <select id="input-day" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Category</label>
                        <select id="input-category" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                            <option value="AUTO">✨ Auto-Detect</option>
                            <option value="Work">💼 Work / Job</option>
                            <option value="Study">📚 Study / Code</option>
                            <option value="Personal">👤 Personal</option>
                            <option value="Fitness">🏋️ Fitness / Health</option>
                            <option value="General">📌 General</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Start Time</label>
                        <input type="time" id="input-start-time" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">End Time</label>
                        <input type="time" id="input-end-time" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                </div>
                <p class="text-[11px] text-slate-400 -mt-2">✨ Entering start & end times automatically configures your countdown timer target (e.g. 21:30 to 21:35 = 5 min countdown).</p>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Notes (Optional)</label>
                    <textarea id="input-notes" rows="2" placeholder="Add additional details or reminders..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm resize-none"></textarea>
                </div>

                <div class="flex items-center justify-end gap-2 pt-3">
                    <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-md transition">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // DEFAULT SAMURAI AVATAR SVG DATA URI
        const DEFAULT_SAMURAI_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><circle cx='256' cy='256' r='256' fill='%23111827'/><circle cx='256' cy='256' r='220' fill='%23991b1b'/><path d='M80 200 L256 90 L432 200 L256 160 Z' fill='%231f2937'/><circle cx='256' cy='280' r='90' fill='%23e5e7eb'/><rect x='190' y='260' width='132' height='16' rx='8' fill='%23111827'/><path d='M256 320 L240 430 L272 430 Z' fill='%23dc2626'/></svg>";

        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const CATEGORIES = {
            'Work': { name: 'Work / Job', icon: '💼', bgLight: 'bg-blue-50 border-blue-200 text-blue-900', bgDark: 'dark:bg-blue-950/40 dark:border-blue-800/60 dark:text-blue-200' },
            'Study': { name: 'Study / Code', icon: '📚', bgLight: 'bg-indigo-50 border-indigo-200 text-indigo-900', bgDark: 'dark:bg-indigo-950/40 dark:border-indigo-800/60 dark:text-indigo-200' },
            'Personal': { name: 'Personal', icon: '👤', bgLight: 'bg-purple-50 border-purple-200 text-purple-900', bgDark: 'dark:bg-purple-950/40 dark:border-purple-800/60 dark:text-purple-200' },
            'Fitness': { name: 'Fitness / Health', icon: '🏋️', bgLight: 'bg-emerald-50 border-emerald-200 text-emerald-900', bgDark: 'dark:bg-emerald-950/40 dark:border-emerald-800/60 dark:text-emerald-200' },
            'General': { name: 'General', icon: '📌', bgLight: 'bg-amber-50 border-amber-200 text-amber-900', bgDark: 'dark:bg-amber-950/40 dark:border-amber-800/60 dark:text-amber-200' }
        };

        // Application State
        let state = {
            activities: [],
            timers: {}, // Active timers: { running, remainingSeconds, targetSeconds, alarmActive, interval }
            title: localStorage.getItem('planner_app_title') || "Weekly Planner Pro",
            avatar: localStorage.getItem('planner_app_avatar') || DEFAULT_SAMURAI_AVATAR,
            viewMode: "grid",
            categoryFilter: "ALL",
            theme: localStorage.getItem('planner_theme') || 'system',
            user: null,
            firestoreUnsubscribe: null
        };

        let fbApp = null;
        let fbAuth = null;
        let fbDb = null;
        let activeAudioIntervals = {};

        // Web Audio API Repeating Alarm Chime
        function startAlarmAudio(taskId) {
            stopAlarmAudio(taskId);
            
            const playChimeSequence = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.4, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.35);
                    });
                } catch (e) {
                    console.warn("Web Audio API error:", e);
                }
            };

            playChimeSequence();
            activeAudioIntervals[taskId] = setInterval(playChimeSequence, 1200);
        }

        function stopAlarmAudio(taskId) {
            if (activeAudioIntervals[taskId]) {
                clearInterval(activeAudioIntervals[taskId]);
                delete activeAudioIntervals[taskId];
            }
        }

        // DOM Elements
        const elContainer = document.getElementById('planner-container');
        const elTitle = document.getElementById('planner-title');
        const elAppAvatar = document.getElementById('app-avatar');
        const elAvatarContainer = document.getElementById('avatar-container');
        const elProfileUpload = document.getElementById('profile-upload');
        const elFilterCategory = document.getElementById('filter-category');
        const elViewBtnGrid = document.getElementById('view-btn-grid');
        const elViewBtnList = document.getElementById('view-btn-list');
        const elStatProgress = document.getElementById('stat-progress');
        const elSyncStatus = document.getElementById('sync-status');

        const elBtnLogin = document.getElementById('btn-google-login');
        const elUserProfile = document.getElementById('user-profile');
        const elUserAvatar = document.getElementById('user-avatar');
        const elUserName = document.getElementById('user-name');
        const elUserEmail = document.getElementById('user-email');
        const elBtnLogout = document.getElementById('btn-logout');

        const elModalActivity = document.getElementById('modal-activity');
        const elFormActivity = document.getElementById('form-activity');

        // Startup Initialization
        window.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            loadLocalStorageData();
            setupAvatarHandling();
            await setupFirebase();
            renderApp();
            attachEventListeners();
        });

        function loadLocalStorageData() {
            elTitle.value = state.title;
            elAppAvatar.src = state.avatar;

            const savedActivities = localStorage.getItem('planner_activities');
            if (savedActivities) {
                try {
                    state.activities = JSON.parse(savedActivities);
                } catch(e) {
                    console.error("Failed parsing activities", e);
                }
            } else {
                state.activities = [
                    { id: '1', title: 'Code Planner Feature', day: 'Monday', category: 'Study', startTime: '21:30', endTime: '21:35', completed: false, notes: 'Interactive countdown timer setup' },
                    { id: '2', title: 'Team Sync Meeting', day: 'Tuesday', category: 'Work', startTime: '10:00', endTime: '10:30', completed: false, notes: 'Project milestone review' },
                    { id: '3', title: 'Gym Legs Workout', day: 'Wednesday', category: 'Fitness', startTime: '17:00', endTime: '18:00', completed: true, notes: 'Focus on squad and calves' }
                ];
                saveLocalActivities();
            }
        }

        function saveLocalActivities() {
            localStorage.setItem('planner_activities', JSON.stringify(state.activities));
        }

        function setupAvatarHandling() {
            elAvatarContainer.addEventListener('click', () => elProfileUpload.click());
            elProfileUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    state.avatar = dataUrl;
                    elAppAvatar.src = dataUrl;
                    localStorage.setItem('planner_app_avatar', dataUrl);
                };
                reader.readAsDataURL(file);
            });
        }

        async function setupFirebase() {
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                    fbApp = initializeApp(firebaseConfig);
                    fbAuth = getAuth(fbApp);
                    fbDb = getFirestore(fbApp);

                    onAuthStateChanged(fbAuth, (user) => {
                        if (user && !user.isAnonymous) {
                            state.user = user;
                            updateUserUI(user);
                            updateCloudStatus('online', 'Logged in with Google');
                            subscribeToFirestore();
                        } else {
                            state.user = null;
                            updateUserUI(null);
                            updateCloudStatus('local', 'Local Storage Active');
                            if (state.firestoreUnsubscribe) state.firestoreUnsubscribe();
                            loadLocalStorageData();
                            renderApp();
                        }
                    });
                } else {
                    updateCloudStatus('local', 'Local Storage Active');
                }
            } catch (err) {
                console.warn("Firebase local fallback:", err);
                updateCloudStatus('local', 'Local Storage Active');
            }
        }

        function updateCloudStatus(mode, text) {
            if (mode === 'online') {
                elSyncStatus.innerHTML = `<i class="fa-solid fa-cloud text-emerald-500 me-1"></i> ${text}`;
            } else {
                elSyncStatus.innerHTML = `<i class="fa-solid fa-hard-drive me-1 text-slate-400"></i> ${text}`;
            }
        }

        function updateUserUI(user) {
            if (user && !user.isAnonymous) {
                elBtnLogin.classList.add('hidden');
                elUserProfile.classList.remove('hidden');
                elUserAvatar.src = user.photoURL || state.avatar;
                elUserName.textContent = user.displayName || 'Google User';
                elUserEmail.textContent = user.email || '';
            } else {
                elBtnLogin.classList.remove('hidden');
                elUserProfile.classList.add('hidden');
            }
        }

        function subscribeToFirestore() {
            if (!state.user || !fbDb) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-planner';
            const userCol = collection(fbDb, 'artifacts', appId, 'users', state.user.uid, 'activities');

            if (state.firestoreUnsubscribe) state.firestoreUnsubscribe();

            state.firestoreUnsubscribe = onSnapshot(query(userCol), (snapshot) => {
                const cloudActivities = [];
                snapshot.forEach((doc) => {
                    cloudActivities.push({ id: doc.id, ...doc.data() });
                });
                state.activities = cloudActivities;
                saveLocalActivities();
                renderApp();
            });
        }

        async function syncSaveActivity(activity) {
            if (state.user && fbDb) {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-planner';
                const docRef = doc(fbDb, 'artifacts', appId, 'users', state.user.uid, 'activities', activity.id);
                await setDoc(docRef, activity, { merge: true });
            } else {
                saveLocalActivities();
                renderApp();
            }
        }

        async function syncDeleteActivity(id) {
            if (state.user && fbDb) {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-planner';
                const docRef = doc(fbDb, 'artifacts', appId, 'users', state.user.uid, 'activities', id);
                await deleteDoc(docRef);
            } else {
                state.activities = state.activities.filter(a => a.id !== id);
                saveLocalActivities();
                renderApp();
            }
        }

        function autoDetectCategory(title) {
            const t = title.toLowerCase();
            if (t.includes('work') || t.includes('job') || t.includes('sync') || t.includes('client') || t.includes('office')) return 'Work';
            if (t.includes('code') || t.includes('study') || t.includes('read') || t.includes('learn') || t.includes('class')) return 'Study';
            if (t.includes('gym') || t.includes('workout') || t.includes('run') || t.includes('fitness') || t.includes('health')) return 'Fitness';
            if (t.includes('personal') || t.includes('movie') || t.includes('anime') || t.includes('home')) return 'Personal';
            return 'General';
        }

        // Calculate Target Duration in Seconds from Start & End Times
        function calculateDurationSeconds(startTime, endTime) {
            if (!startTime || !endTime) return 300; // Default 5 mins (300s) if not specified
            const [h1, m1] = startTime.split(':').map(Number);
            const [h2, m2] = endTime.split(':').map(Number);
            let startMinutes = h1 * 60 + m1;
            let endMinutes = h2 * 60 + m2;
            if (endMinutes < startMinutes) endMinutes += 24 * 60; // Handle overnight wrap
            const diffMinutes = endMinutes - startMinutes;
            return diffMinutes > 0 ? diffMinutes * 60 : 300;
        }

        function renderApp() {
            updateStats();
            const filtered = state.activities.filter(act => {
                if (state.categoryFilter !== 'ALL' && act.category !== state.categoryFilter) return false;
                return true;
            });

            if (state.viewMode === 'grid') {
                renderGridView(filtered);
            } else {
                renderListView(filtered);
            }
        }

        function updateStats() {
            const total = state.activities.length;
            const completed = state.activities.filter(a => a.completed).length;
            elStatProgress.textContent = `${completed}/${total}`;
        }

        function renderGridView(activities) {
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-4">`;

            DAYS.forEach(day => {
                const dayActivities = activities.filter(a => a.day === day);
                dayActivities.sort((a,b) => (a.startTime || '').localeCompare(b.startTime || ''));

                html += `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700/80 p-3 flex flex-col min-h-[340px] shadow-sm">
                        <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-100 dark:border-slate-700/60">
                            <span class="font-bold text-xs uppercase tracking-wider text-slate-800 dark:text-slate-100">${day}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 font-bold">${dayActivities.length}</span>
                        </div>

                        <div class="flex-grow space-y-2.5">
                            ${dayActivities.length === 0 ? `
                                <div class="h-28 flex flex-col items-center justify-center text-slate-300 dark:text-slate-600 border-2 border-dashed border-slate-100 dark:border-slate-700/50 rounded-xl">
                                    <i class="fa-solid fa-calendar-plus text-base mb-1"></i>
                                    <span class="text-[10px]">No tasks</span>
                                </div>
                            ` : dayActivities.map(act => renderActivityCard(act)).join('')}
                        </div>

                        <button onclick="window.openAddModalForDay('${day}')" class="mt-3 w-full py-1.5 text-xs text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl hover:border-brand-500 transition flex items-center justify-center gap-1 font-semibold">
                            <i class="fa-solid fa-plus text-[10px]"></i> Add Task
                        </button>
                    </div>
                `;
            });

            html += `</div>`;
            elContainer.innerHTML = html;
        }

        function renderListView(activities) {
            let html = `<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm max-w-4xl mx-auto space-y-4">`;

            if (activities.length === 0) {
                html += `
                    <div class="py-12 text-center text-slate-400 dark:text-slate-500">
                        <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                        <p class="text-xs">No tasks found matching your filter.</p>
                    </div>
                `;
            } else {
                DAYS.forEach(day => {
                    const dayActivities = activities.filter(a => a.day === day);
                    if (dayActivities.length === 0) return;

                    dayActivities.sort((a,b) => (a.startTime || '').localeCompare(b.startTime || ''));

                    html += `
                        <div>
                            <h4 class="font-bold text-xs uppercase tracking-wider text-slate-400 mb-2">${day}</h4>
                            <div class="space-y-2">
                                ${dayActivities.map(act => renderActivityCard(act)).join('')}
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            elContainer.innerHTML = html;
        }

        function formatTimeSeconds(totalSec) {
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function renderActivityCard(act) {
            const cat = CATEGORIES[act.category] || CATEGORIES['General'];
            const timeText = (act.startTime || act.endTime) ? `${act.startTime || ''}${act.endTime ? ' - ' + act.endTime : ''}` : '';
            
            const targetSec = calculateDurationSeconds(act.startTime, act.endTime);
            if (!state.timers[act.id]) {
                state.timers[act.id] = { running: false, remainingSeconds: targetSec, targetSeconds: targetSec, alarmActive: false, interval: null };
            }
            const timerState = state.timers[act.id];
            const formattedTimer = formatTimeSeconds(timerState.remainingSeconds);

            let timerClasses = '';
            if (timerState.alarmActive) {
                timerClasses = 'timer-alarm';
            } else if (timerState.running) {
                timerClasses = 'timer-running';
            }

            return `
                <div class="group relative p-2.5 rounded-xl border ${cat.bgLight} ${cat.bgDark} transition-all duration-150 ${timerClasses} ${act.completed ? 'opacity-60' : ''}">
                    <div class="flex items-start gap-2">
                        <input type="checkbox" ${act.completed ? 'checked' : ''} 
                            onchange="window.toggleTaskComplete('${act.id}')"
                            class="mt-1 w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                        
                        <div class="flex-grow min-w-0">
                            <div class="flex items-center justify-between gap-1">
                                <span class="text-xs font-bold truncate ${act.completed ? 'line-through text-slate-500 dark:text-slate-400' : ''}">
                                    ${cat.icon} ${escapeHtml(act.title)}
                                </span>
                            </div>
                            
                            ${timeText ? `<p class="text-[10px] opacity-75 mt-0.5"><i class="fa-regular fa-clock me-1"></i>${timeText} (${Math.round(targetSec/60)}m duration)</p>` : ''}
                            ${act.notes ? `<p class="text-[10px] opacity-80 mt-0.5 italic truncate">${escapeHtml(act.notes)}</p>` : ''}

                            <!-- Interactive Countdown Timer Bar -->
                            <div class="mt-2 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 flex items-center justify-between text-[11px]">
                                <div class="flex items-center gap-1 font-mono font-bold ${timerState.alarmActive ? 'text-red-600 dark:text-red-400 font-extrabold animate-bounce' : (timerState.running ? 'text-brand-600 dark:text-brand-400' : 'text-slate-600 dark:text-slate-300')}">
                                    <i class="fa-solid ${timerState.alarmActive ? 'fa-bell text-red-500' : 'fa-stopwatch text-[10px]'}"></i>
                                    <span>${formattedTimer}</span>
                                </div>

                                <div class="flex items-center gap-1">
                                    ${timerState.alarmActive ? `
                                        <button onclick="window.stopAlarm('${act.id}')" class="p-1 px-2 text-[10px] bg-red-600 hover:bg-red-700 text-white font-bold rounded-md transition shadow-sm animate-pulse">
                                            <i class="fa-solid fa-volume-xmark me-1"></i> Stop Alarm
                                        </button>
                                    ` : !timerState.running ? `
                                        <button onclick="window.startTimer('${act.id}')" class="p-1 px-2 text-[10px] bg-emerald-600 hover:bg-emerald-700 text-white rounded-md transition" title="Start Countdown">
                                            <i class="fa-solid fa-play"></i>
                                        </button>
                                    ` : `
                                        <button onclick="window.pauseTimer('${act.id}')" class="p-1 px-2 text-[10px] bg-amber-500 hover:bg-amber-600 text-white rounded-md transition" title="Pause Countdown">
                                            <i class="fa-solid fa-pause"></i>
                                        </button>
                                    `}
                                    <button onclick="window.resetTimer('${act.id}')" class="p-1 px-1.5 text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md hover:bg-slate-300 transition" title="Reset Countdown">
                                        <i class="fa-solid fa-rotate-right"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="window.editActivity('${act.id}')" class="p-1 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
                                <i class="fa-solid fa-pen text-[10px]"></i>
                            </button>
                            <button onclick="window.deleteActivity('${act.id}')" class="p-1 text-slate-400 hover:text-red-500">
                                <i class="fa-solid fa-trash-can text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function attachEventListeners() {
            elTitle.addEventListener('change', (e) => {
                state.title = e.target.value;
                localStorage.setItem('planner_app_title', state.title);
            });

            elViewBtnGrid.addEventListener('click', () => {
                state.viewMode = 'grid';
                elViewBtnGrid.className = "p-2 text-xs font-semibold rounded-lg bg-brand-500 text-white transition";
                elViewBtnList.className = "p-2 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition";
                renderApp();
            });

            elViewBtnList.addEventListener('click', () => {
                state.viewMode = 'list';
                elViewBtnList.className = "p-2 text-xs font-semibold rounded-lg bg-brand-500 text-white transition";
                elViewBtnGrid.className = "p-2 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition";
                renderApp();
            });

            elFilterCategory.addEventListener('change', (e) => {
                state.categoryFilter = e.target.value;
                renderApp();
            });

            // One-Tap Google Login
            elBtnLogin.addEventListener('click', async () => {
                if (!fbAuth) {
                    alert("Running in local browser mode. All your planner entries save automatically to LocalStorage!");
                    return;
                }
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    await signInWithPopup(fbAuth, provider);
                } catch (e) {
                    console.error("Google login error:", e);
                }
            });

            elBtnLogout.addEventListener('click', async () => {
                if (fbAuth) await signOut(fbAuth);
            });

            document.getElementById('btn-theme-toggle').addEventListener('click', toggleTheme);

            document.getElementById('btn-open-add').addEventListener('click', () => openActivityModal());
            document.getElementById('btn-close-modal').addEventListener('click', closeActivityModal);
            document.getElementById('btn-cancel-modal').addEventListener('click', closeActivityModal);

            elFormActivity.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('activity-id').value || crypto.randomUUID();
                const titleVal = document.getElementById('input-title').value.trim();
                let catVal = document.getElementById('input-category').value;
                
                if (catVal === 'AUTO') {
                    catVal = autoDetectCategory(titleVal);
                }

                const activity = {
                    id,
                    title: titleVal,
                    day: document.getElementById('input-day').value,
                    category: catVal,
                    startTime: document.getElementById('input-start-time').value,
                    endTime: document.getElementById('input-end-time').value,
                    notes: document.getElementById('input-notes').value.trim(),
                    completed: false
                };

                const existing = state.activities.find(a => a.id === id);
                if (existing) activity.completed = existing.completed;

                const index = state.activities.findIndex(a => a.id === id);
                if (index > -1) {
                    state.activities[index] = activity;
                } else {
                    state.activities.push(activity);
                }

                // Reset timer target duration for edited task
                delete state.timers[id];

                await syncSaveActivity(activity);
                closeActivityModal();
            });
        }

        // COUNTDOWN TIMER & ALARM ACTIONS
        window.startTimer = (id) => {
            const act = state.activities.find(a => a.id === id);
            const targetSec = calculateDurationSeconds(act?.startTime, act?.endTime);

            if (!state.timers[id]) {
                state.timers[id] = { running: false, remainingSeconds: targetSec, targetSeconds: targetSec, alarmActive: false, interval: null };
            }

            const timer = state.timers[id];
            if (timer.running || timer.remainingSeconds <= 0) return;

            timer.running = true;
            timer.alarmActive = false;

            timer.interval = setInterval(() => {
                timer.remainingSeconds--;

                // When Countdown reaches 00:00 -> RING ALARM AUTOMATICALLY
                if (timer.remainingSeconds <= 0) {
                    clearInterval(timer.interval);
                    timer.running = false;
                    timer.remainingSeconds = 0;
                    timer.alarmActive = true;
                    startAlarmAudio(id); // Play audio alarm chime continuously
                }

                renderApp();
            }, 1000);

            renderApp();
        };

        window.pauseTimer = (id) => {
            const timer = state.timers[id];
            if (timer && timer.running) {
                clearInterval(timer.interval);
                timer.running = false;
                renderApp();
            }
        };

        window.resetTimer = (id) => {
            const act = state.activities.find(a => a.id === id);
            const targetSec = calculateDurationSeconds(act?.startTime, act?.endTime);

            stopAlarmAudio(id);
            if (state.timers[id] && state.timers[id].interval) {
                clearInterval(state.timers[id].interval);
            }

            state.timers[id] = {
                running: false,
                remainingSeconds: targetSec,
                targetSeconds: targetSec,
                alarmActive: false,
                interval: null
            };

            renderApp();
        };

        window.stopAlarm = (id) => {
            stopAlarmAudio(id);
            if (state.timers[id]) {
                state.timers[id].alarmActive = false;
            }
            renderApp();
        };

        window.openAddModalForDay = (day) => {
            openActivityModal(null, day);
        };

        window.toggleTaskComplete = async (id) => {
            const activity = state.activities.find(a => a.id === id);
            if (activity) {
                activity.completed = !activity.completed;
                if (activity.completed) {
                    window.stopAlarm(id);
                    window.pauseTimer(id);
                }
                await syncSaveActivity(activity);
            }
        };

        window.editActivity = (id) => {
            const activity = state.activities.find(a => a.id === id);
            if (activity) openActivityModal(activity);
        };

        window.deleteActivity = async (id) => {
            const activity = state.activities.find(a => a.id === id);
            if (activity && confirm(`Delete task "${activity.title}"?`)) {
                window.stopAlarm(id);
                window.resetTimer(id);
                await syncDeleteActivity(id);
            }
        };

        function openActivityModal(activity = null, day = 'Monday') {
            document.getElementById('activity-id').value = activity ? activity.id : '';
            document.getElementById('input-title').value = activity ? activity.title : '';
            document.getElementById('input-day').value = activity ? activity.day : day;
            document.getElementById('input-category').value = activity ? activity.category : 'AUTO';
            document.getElementById('input-start-time').value = activity ? activity.startTime || '' : '';
            document.getElementById('input-end-time').value = activity ? activity.endTime || '' : '';
            document.getElementById('input-notes').value = activity ? activity.notes || '' : '';
            
            document.getElementById('modal-activity-title').textContent = activity ? 'Edit Task' : 'Add Task';

            elModalActivity.classList.remove('hidden');
            elModalActivity.classList.add('flex');
            setTimeout(() => {
                elModalActivity.querySelector('.modal-content').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeActivityModal() {
            const content = elModalActivity.querySelector('.modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                elModalActivity.classList.add('hidden');
                elModalActivity.classList.remove('flex');
            }, 150);
        }

        function initTheme() {
            const isDark = state.theme === 'dark' || (state.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            state.theme = isDark ? 'dark' : 'light';
            localStorage.setItem('planner_theme', state.theme);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
